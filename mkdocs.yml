site_name: Smart AutoSorter AI Pro API
theme:
  name: material

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  *.draft.md
  drafts/
  agents/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true

nav:
  - User Guide: user_guide.md
  - Administrator Guide: admin_guide.md
  - Interactive Tutorials:
    - Stateful ML Analyzer Clustering: tutorials/01_ml_analyzer_clustering.md
    - Multi-Format Text Extraction: tutorials/02_multi_format_text_extraction.md
    - Virtual Sorting Verification: tutorials/03_virtual_sorting_verification.md
  - Troubleshooting: troubleshooting.md
  - Developer Reference:
    - API Reference: api_reference.md
    - Architecture & Internals: architecture.md
    - Architecture Decisions:
      - adr/0001-local-first-no-cloud-processing.md
      - adr/0002-encrypt-extracted-text-at-rest.md
      - adr/0003-single-writer-database-thread.md
      - adr/0004-clustering-in-a-spawned-subprocess.md
      - adr/0005-moves-never-destroy-unverified-bytes.md
    - Auto-Merge Policy: auto_merge_policy.md
    - Branch Protection Rules: branch_protection.md
    - Contributor Guide: contributor.md
    - Developer Guides:
      - Core: core.md
      - UI: ui.md
