name: Scheduled Dependency Vulnerability Audit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-stage:
    name: Audit and Stage Vulnerability Patches
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --frozen --group dev

      - name: Run Dependency Audit and Stage Patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          uv run python scripts/remediate_vulnerabilities.py --stage-dir remediation-stage

      - name: Upload Staged Remediation Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remediation-stage
          path: remediation-stage/
          if-no-files-found: ignore
          retention-days: 7

  publish-remediation:
    name: Publish Staged Remediation PRs and Alerts
    needs: [audit-and-stage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --frozen --group dev

      - name: Download Staged Remediation Artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remediation-stage
          path: remediation-stage

      - name: Publish Signed Security PRs and Triage Alerts
        env:
          REMEDIATION_APP_ID: ${{ secrets.REMEDIATION_APP_ID }}
          REMEDIATION_APP_PRIVATE_KEY: ${{ secrets.REMEDIATION_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUDIT_JOB_STATUS: ${{ needs.audit-and-stage.result }}
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          uv run --no-sync python scripts/remediate_vulnerabilities.py \
            --publish-from remediation-stage \
            --audit-job-status "$AUDIT_JOB_STATUS" \
            --require-app-token
