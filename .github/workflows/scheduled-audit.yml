name: Scheduled Dependency Vulnerability Audit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  scheduled-vulnerability-audit:
    name: Scheduled Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups

      - name: Run Dependency Audit & CVE Patch Generator
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          set +e
          uv run python scripts/remediate_vulnerabilities.py 2>&1 | tee audit_report.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Vulnerabilities detected by uv audit."
            exit "$EXIT_CODE"
          fi

      - name: Report Security Vulnerabilities
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report = '';
            if (fs.existsSync('audit_report.txt')) {
              report = fs.readFileSync('audit_report.txt', 'utf8').trim();
            } else {
              report = 'No audit report output captured.';
            }

            const issueTitle = '[Security] Automated Dependency Audit Failure';
            const labelName = 'security';

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labelName,
            });

            const existingIssue = openIssues.find(issue =>
              issue.title === issueTitle ||
              issue.title.includes('Automated Dependency Audit Failure') ||
              issue.title.includes('Automated Vulnerability Audit Alert')
            );

            const body = `## ⚠️ Security Vulnerability Audit Failure Alert\n\nThe scheduled automated vulnerability audit detected one or more unexempted security vulnerabilities in production dependencies (\`uv.lock\`).\n\n### Audit Report Details\n\n\`\`\`text\n${report}\n\`\`\`\n\n---\n*Last audited at: ${new Date().toUTCString()}*\n*Triggered by scheduled workflow run: [Run Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*\n`;

            if (existingIssue) {
              console.log(`Updating existing open security issue #${existingIssue.number}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body,
              });
            } else {
              console.log('Creating new security issue');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: body,
                labels: [labelName],
              });
            }
