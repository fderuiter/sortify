name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-audit:
    name: Security & Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --all-groups

    - name: Run Dependency Audit
      run: |
        uv audit || true

    - name: Secret Scanning Guardrails
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Workflow Linting
      run: |
        uvx --from actionlint-py actionlint

  type-check:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --all-groups

    - name: Run MyPy Type Check
      run: |
        uv run mypy app/

  build-and-test:
    name: Build & Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --all-groups

    - name: Lint with Ruff
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run ruff check .

    - name: Validate External Links
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/validate_links.py

    - name: Validate API and CLI Signatures
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/validate_signatures.py

    - name: Validate Architectural Guardrails
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/validate_architecture.py

    - name: Continuous Integration Accessibility Gate
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/run_a11y_gate.py

    - name: Validate Agent Prompts Manifest
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/prompt_manifest.py verify

    - name: Validate Configuration Schema
      run: |
        uv run python scripts/validate_config.py

    - name: CLI Smoke Tests
      run: |
        uv run python scripts/test_cli.py
    - name: Fast Smoke Tests
      env:
        SMOKE_TEST: "0"
      shell: bash
      run: |
        if ! uv run pytest -m "not slow" -n auto tests/; then
          if [ -f pytest_failures.txt ]; then
            echo "=== PYTEST FAILURES ==="
            cat pytest_failures.txt
          else
            echo "No pytest_failures.txt found."
          fi
          exit 1
        fi

    - name: Upload Test Coverage Artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: test-coverage-report
        path: |
          htmlcov/
          coverage.xml
        retention-days: 14

    - name: Build executable (Lite)
      if: matrix.os == 'windows-latest'
      run: |
        uv run python scripts/build.py --lite

    - name: Verify compiled executable (Windows Smoke Test)
      if: matrix.os == 'windows-latest'
      shell: python
      run: |
        import subprocess, sys, os
        res = subprocess.run([r"dist/smart-autosorter/smart-autosorter.exe", "--smoke-test"])
        if res.returncode != 0:
            print(f"Smoke test failed with exit code {res.returncode}")
            found_log = False
            for path in ["smoke_test_error.txt", r"dist/smart-autosorter/smoke_test_error.txt"]:
                if os.path.exists(path):
                    with open(path, "r", encoding="utf-8") as f:
                        print("=== smoke_test_error.txt ===")
                        print(f.read())
                    found_log = True
                    break
            if not found_log:
                print("No smoke_test_error.txt found.")
            sys.exit(res.returncode)

  changes:
    name: Detect Documentation Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          docs:
            - 'docs/**'
            - 'mkdocs.yml'

  doc-deploy:
    name: Doc Deploy
    needs: [build-and-test, changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --all-groups

    - name: Validate Documentation and Integrity
      run: |
        uv run docs --check

    - name: Deploy Documentation
      if: github.ref == 'refs/heads/main'
      run: |
        uv run mkdocs gh-deploy --force

  heavy-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache Model Weights and Assets
      uses: actions/cache@v4
      with:
        path: |
          ~/.smart-autosorter/offline_bundle
          offline_bundle/
          ~/.cache/huggingface
        key: model-weights-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'offline_bundle/**', 'app/core/prompt_manifest.py') }}
        restore-keys: |
          model-weights-${{ runner.os }}-

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --all-groups

    - name: Heavy ML and Integration Tests
      shell: bash
      run: |
        if ! uv run pytest -m "slow" -n auto --cov --cov-report=term tests/; then
          if [ -f pytest_failures.txt ]; then
            echo "=== PYTEST FAILURES ==="
            cat pytest_failures.txt
          else
            echo "No pytest_failures.txt found."
          fi
          exit 1
        fi
