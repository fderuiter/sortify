name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A new push or controller branch update supersedes any in-progress run on the
# same feature branch across pull_request and workflow_dispatch. On main, an
# in-progress run always finishes intact; only the newest waiting run is kept.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && format('{0}:{1}', github.event.pull_request.head.repo.full_name, github.head_ref)) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  security-and-audit:
    name: Security & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen --only-group dev --no-install-project

    - name: Run Dependency Audit
      run: |
        uv audit --ignore-until-fixed GHSA-w8v5-vhqr-4h9v

    - name: Scope Secret Scan Commits
      id: scope-gitleaks
      if: github.event_name == 'workflow_dispatch'
      shell: python
      run: |
        import json
        import os
        import subprocess
        from pathlib import Path

        event_path = Path(os.environ["GITHUB_EVENT_PATH"])
        payload = json.loads(event_path.read_text(encoding="utf-8"))
        ref = os.environ.get("GITHUB_REF", "")
        head_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

        if ref == "refs/heads/main":
            commits = [{"id": head_sha}]
        else:
            has_origin_main = (
                subprocess.run(
                    ["git", "rev-parse", "--verify", "refs/remotes/origin/main"],
                    capture_output=True,
                    text=True,
                ).returncode
                == 0
            )
            if not has_origin_main:
                subprocess.run(
                    [
                        "git",
                        "fetch",
                        "--no-tags",
                        "origin",
                        "+refs/heads/main:refs/remotes/origin/main",
                    ],
                    check=True,
                )
            branch_shas = [
                line.strip()
                for line in subprocess.check_output(
                    [
                        "git",
                        "rev-list",
                        "--reverse",
                        "--first-parent",
                        "--no-merges",
                        "refs/remotes/origin/main..HEAD",
                    ],
                    text=True,
                ).splitlines()
                if line.strip()
            ]
            if not branch_shas:
                commits = []
            elif branch_shas[0] == head_sha:
                commits = [{"id": head_sha}]
            else:
                commits = [{"id": branch_shas[0]}, {"id": head_sha}]

        payload["commits"] = commits
        scoped_path = Path(os.environ["RUNNER_TEMP"]) / "gitleaks_scoped_event.json"
        scoped_path.write_text(json.dumps(payload), encoding="utf-8")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out_f:
            out_f.write(f"event_path={scoped_path}\n")

    - name: Secret Scanning Guardrails
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}
        GITHUB_EVENT_PATH: ${{ steps.scope-gitleaks.outputs.event_path || github.event_path }}

    - name: Workflow Linting
      uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  type-check:
    name: Type Check (ty)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen --group dev

    - name: Run Multi-Platform ty Guardrail
      run: |
        uv run python scripts/check_ty_warnings.py --github-annotations

  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen --group dev --group docs

    - name: Lint with Ruff
      run: |
        uv run ruff check .

    - name: Format with Ruff
      run: |
        uv run ruff format --check .

    - name: Validate External Links
      run: |
        uv run python scripts/validate_links.py --local-only

    - name: Validate API and CLI Signatures
      run: |
        uv run python scripts/validate_signatures.py

    - name: Validate Architectural Guardrails
      run: |
        uv run python scripts/validate_architecture.py

    - name: Check dependency declarations
      run: |
        uv run deptry .

    - name: Validate Agent Prompts Manifest
      run: |
        uv run python scripts/prompt_manifest.py verify --strict

    - name: Validate Configuration Schema
      run: |
        uv run python scripts/validate_config.py --check

    - name: Validate Documentation and Integrity
      env:
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF_FULL: ${{ github.ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        BUILD_FLAG="--build"
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$GITHUB_REF_FULL" != "refs/heads/main" ]; then
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] \
            && MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)" \
            && CHANGED_FILES="$(git diff --name-only --no-renames "$MERGE_BASE" "$HEAD_SHA" 2>/dev/null)"; then
            if ! printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(docs/|mkdocs\.yml$|[^/]+\.[mM][dD]$|scripts/generate_docs\.py$)'; then
              BUILD_FLAG="--no-build"
            fi
          fi
        fi
        uv run python scripts/generate_docs.py --check --local-only "$BUILD_FLAG"

    - name: Upload Documentation Site Artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: docs-site
        path: site/
        if-no-files-found: error
        retention-days: 7

  build-and-test:
    name: Build & Test
    needs: [security-and-audit, type-check, static-checks]
    strategy:
      # Let every OS finish so a failure on one doesn't hide the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen --group dev --group build

    - name: Terminal Interface Snapshot Validation
      run: |
        uv run pytest tests/test_visual_snapshots.py -n 0

    - name: Upload Snapshot Mismatch Artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: snapshot-mismatches-${{ matrix.os }}
        path: |
          tests/snapshots/tui_svg/*.actual
          tests/snapshots/*.actual
        retention-days: 7

    - name: CLI Smoke Tests
      run: |
        uv run python scripts/test_cli.py

    - name: Fast Smoke Tests
      env:
        SMOKE_TEST: "0"
      shell: bash
      run: |
        # Fast-suite coverage was 76% on Linux when this gate was set (#738); the
        # margin leaves room for platform-specific skips on Windows and macOS.
        # Linux also measures branches (72.9% on 2026-10-19) for the per-module
        # floors checked in the next step.
        BRANCH_FLAG=""
        if [ "$RUNNER_OS" = "Linux" ]; then BRANCH_FLAG="--cov-branch"; fi
        if ! uv run pytest -m "not slow" -n auto --cov=app $BRANCH_FLAG --cov-report=xml --cov-report=html --cov-report=json --cov-report=term --cov-fail-under=70 tests/; then
          if [ -f pytest_failures.txt ]; then
            echo "=== PYTEST FAILURES ==="
            cat pytest_failures.txt
          else
            echo "No pytest_failures.txt found."
          fi
          exit 1
        fi

    - name: Check Data-Safety Coverage Floors
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/check_coverage_floors.py coverage.json

    - name: Upload Test Coverage Artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-coverage-report
        path: |
          htmlcov/
          coverage.xml
        retention-days: 14

    - name: Build executable (Lite)
      run: |
        uv run python scripts/build.py --lite

    - name: Verify compiled executable (Smoke Test)
      shell: python
      run: |
        import subprocess, sys, os
        exe_ext = ".exe" if sys.platform == "win32" else ""
        cli_exe = os.path.join("dist", "smart-autosorter", f"smart-autosorter{exe_ext}")
        if not os.path.exists(cli_exe):
            print(f"Missing CLI executable target: {cli_exe}")
            sys.exit(1)
        res = subprocess.run([cli_exe, "--smoke-test"])
        if res.returncode != 0:
            print(f"Smoke test failed with exit code {res.returncode}")
            found_log = False
            for path in ["smoke_test_error.txt", os.path.join("dist", "smart-autosorter", "smoke_test_error.txt")]:
                if os.path.exists(path):
                    with open(path, "r", encoding="utf-8") as f:
                        print("=== smoke_test_error.txt ===")
                        print(f.read())
                    found_log = True
                    break
            if not found_log:
                print("No smoke_test_error.txt found.")
            sys.exit(res.returncode)

  # Publishes the prebuilt site artifact from static-checks after required-ci
  # succeeds on main, keeping contents: write out of checkout and build steps.
  doc-deploy:
    name: Doc Deploy
    needs: [required-ci]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: doc-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
    - name: Download Documentation Site Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docs-site
        path: site

    - name: Deploy Documentation
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        SITE_DIR="${PWD}/site"
        if [ ! -f "${SITE_DIR}/index.html" ]; then
          echo "Error: Prebuilt site/index.html is missing from docs-site artifact." >&2
          exit 1
        fi

        # actions/upload-artifact drops dotfiles by default; restore .nojekyll so
        # GitHub Pages serves underscore-prefixed assets without Jekyll processing.
        : > "${SITE_DIR}/.nojekyll"

        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "Error: GITHUB_TOKEN must be provided via environment." >&2
          exit 1
        fi

        SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"
        REMOTE_URL="${SERVER_URL}/${GITHUB_REPOSITORY}.git"
        AUTH_HEADER="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\r\n')"

        export GIT_TERMINAL_PROMPT=0
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_HEADER}"

        TMP_ROOT="$(mktemp -d)"
        trap 'rm -rf "${TMP_ROOT}"' EXIT
        META_DIR="${TMP_ROOT}/meta"
        PAGES_DIR="${TMP_ROOT}/pages"

        git init --quiet "${META_DIR}"
        git -C "${META_DIR}" config core.hooksPath /dev/null
        git -C "${META_DIR}" fetch --quiet --no-tags --filter=blob:none "${REMOTE_URL}" "+refs/heads/main:refs/remotes/origin/main"

        if ! git -C "${META_DIR}" merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main 2>/dev/null; then
          echo "Skipping deployment: ${GITHUB_SHA} is not an ancestor of refs/heads/main."
          exit 0
        fi

        git init --quiet "${PAGES_DIR}"
        git -C "${PAGES_DIR}" config core.hooksPath /dev/null
        git -C "${PAGES_DIR}" config core.excludesFile /dev/null
        git -C "${PAGES_DIR}" config user.name "github-actions[bot]"
        git -C "${PAGES_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        DEPLOYED_COMMIT=""
        if git -C "${PAGES_DIR}" ls-remote --exit-code --heads "${REMOTE_URL}" refs/heads/gh-pages >/dev/null 2>&1; then
          git -C "${PAGES_DIR}" fetch --quiet --no-tags --depth=1 "${REMOTE_URL}" "+refs/heads/gh-pages:refs/remotes/origin/gh-pages"
          LAST_MSG="$(git -C "${PAGES_DIR}" log -1 --format=%B refs/remotes/origin/gh-pages)"
          DEPLOYED_SHA=""
          if [[ "${LAST_MSG}" =~ Deployed[[:space:]]+([0-9a-f]{7,40}) ]]; then
            DEPLOYED_SHA="${BASH_REMATCH[1]}"
          fi
          if [ -n "${DEPLOYED_SHA}" ]; then
            DEPLOYED_COMMIT="$(git -C "${META_DIR}" rev-parse --verify "${DEPLOYED_SHA}^{commit}" 2>/dev/null || true)"
          fi
          if [ -n "${DEPLOYED_COMMIT}" ] && [ "${DEPLOYED_COMMIT}" != "${GITHUB_SHA}" ]; then
            if git -C "${META_DIR}" merge-base --is-ancestor "${DEPLOYED_COMMIT}" refs/remotes/origin/main 2>/dev/null \
              && git -C "${META_DIR}" merge-base --is-ancestor "${GITHUB_SHA}" "${DEPLOYED_COMMIT}" 2>/dev/null; then
              echo "Skipping deployment: gh-pages already contains newer main commit ${DEPLOYED_COMMIT} (current run is ${GITHUB_SHA})."
              exit 0
            fi
          fi
          git -C "${PAGES_DIR}" checkout --quiet -B gh-pages refs/remotes/origin/gh-pages
          git -C "${PAGES_DIR}" rm -rf --quiet --ignore-unmatch .
        else
          git -C "${PAGES_DIR}" checkout --quiet --orphan gh-pages
        fi

        cp -a "${SITE_DIR}/." "${PAGES_DIR}/"
        git -C "${PAGES_DIR}" add --all --force

        if [ "${DEPLOYED_COMMIT}" = "${GITHUB_SHA}" ] && git -C "${PAGES_DIR}" diff --cached --quiet; then
          echo "Skipping deployment: gh-pages is already up to date for ${GITHUB_SHA}."
          exit 0
        fi

        git -C "${PAGES_DIR}" commit --quiet --allow-empty -m "Deployed ${GITHUB_SHA}"
        git -C "${PAGES_DIR}" push --quiet "${REMOTE_URL}" HEAD:refs/heads/gh-pages

  heavy-tests:
    name: Heavy Tests
    needs: [security-and-audit, type-check, static-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Cache Model Weights and Assets
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.smart-autosorter/offline_bundle
          offline_bundle/
          ~/.cache/huggingface
        # No restore-keys: weights saved for another manifest must not be
        # restored and tested as if they were the pinned ones.
        key: model-weights-${{ runner.os }}-${{ hashFiles('uv.lock', 'scripts/build.py', 'offline_bundle/**', 'scripts/prompt_manifest.py', '.github/AGENTS/manifest.json') }}

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen --group dev --extra ml

    - name: Heavy ML and Integration Tests
      shell: bash
      run: |
        if ! uv run pytest -m "slow" -n auto --ignore=tests/test_visual_snapshots.py --cov --cov-report=term tests/; then
          if [ -f pytest_failures.txt ]; then
            echo "=== PYTEST FAILURES ==="
            cat pytest_failures.txt
          else
            echo "No pytest_failures.txt found."
          fi
          exit 1
        fi

  verify-offline-bundle:
    name: Verify Offline Bundle
    needs: [security-and-audit, type-check, static-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Cache Offline Wheel Downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
        key: offline-wheels-${{ runner.os }}-${{ hashFiles('offline_bundle/requirements.txt') }}
        restore-keys: |
          offline-wheels-${{ runner.os }}-

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.1"
        enable-cache: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Verify Offline Manifest Matches Lockfile
      run: |
        uv run --no-project python scripts/prepare_offline.py --cpu --verify-lockfile

    - name: Prepare Offline Bundle
      run: |
        uv run --no-project python scripts/prepare_offline.py --cpu --frozen

    - name: Verify Tracked Manifest Unmodified
      run: |
        git diff --exit-code

    - name: Verify Offline Bundle Archive Exists
      run: |
        if [ ! -f offline_bundle.zip ]; then
          echo "Error: offline_bundle.zip was not produced by scripts/prepare_offline.py"
          exit 1
        fi

    - name: Install Offline Bundle
      run: |
        uv run --no-project python scripts/install_offline.py offline-install
        git diff --exit-code

    - name: Verify Application and ML Imports in Offline Environment
      run: |
        .venv/bin/python - <<'PY'
        import app
        import app.config
        import app.core
        import app.main
        import easyocr
        import llama_cpp
        import onnxruntime
        import torch
        import transformers
        from app.core.verifier import is_ml_available

        assert is_ml_available(), "Expected is_ml_available() to return True"
        assert torch.cuda.is_available() is False, "Expected CPU-only PyTorch build"
        print("Application and ML modules successfully imported from offline bundle environment!")
        PY

  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security-and-audit, type-check, static-checks, build-and-test, heavy-tests, verify-offline-bundle]
    if: ${{ always() }}
    steps:
      - name: Verify Required Gates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const needsResults = ${{ toJson(needs) }};
            console.log("Job status results:", JSON.stringify(needsResults, null, 2));

            let failedJobs = [];
            for (const [jobName, jobData] of Object.entries(needsResults)) {
              if (!jobData || jobData.result !== 'success') {
                failedJobs.push(`${jobName}: ${jobData ? jobData.result : 'unknown/missing'}`);
              }
            }

            if (failedJobs.length > 0) {
              core.setFailed(`Required CI gate failed. The following required jobs did not succeed:\n${failedJobs.join('\n')}`);
            } else {
              console.log("All required CI checks passed successfully.");
            }
