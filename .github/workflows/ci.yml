name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        uv sync --all-groups
        
    - name: Lint with Ruff
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run ruff check .
        
    - name: Validate External Links
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/validate_links.py
        
    - name: Validate API and CLI Signatures
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/validate_signatures.py
        
    - name: Validate Architectural Guardrails
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/validate_architecture.py
        
    - name: Validate Agent Prompts Manifest
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/prompt_manifest.py verify
        
    - name: Validate Configuration Schema
      run: |
        uv run python scripts/validate_config.py
        
    - name: CLI Smoke Tests
      run: |
        uv run python scripts/test_cli.py
        
    - name: Test with pytest
      env:
        SMOKE_TEST: "0"
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          uv run pytest --cov --cov-report=term tests/
        else
          if ! uv run pytest tests/; then
            if [ -f pytest_failures.txt ]; then
              echo "=== PYTEST FAILURES ==="
              cat pytest_failures.txt
            else
              echo "No pytest_failures.txt found."
            fi
            exit 1
          fi
        fi

    - name: Build executable (Lite)
      if: matrix.os == 'windows-latest'
      run: |
        uv run python scripts/build.py --lite

    - name: Verify compiled executable (Windows Smoke Test)
      if: matrix.os == 'windows-latest'
      shell: python
      run: |
        import subprocess, sys, os
        res = subprocess.run([r"dist/smart-autosorter/smart-autosorter.exe", "--smoke-test"])
        if res.returncode != 0:
            print(f"Smoke test failed with exit code {res.returncode}")
            found_log = False
            for path in ["smoke_test_error.txt", r"dist/smart-autosorter/smoke_test_error.txt"]:
                if os.path.exists(path):
                    with open(path, "r", encoding="utf-8") as f:
                        print("=== smoke_test_error.txt ===")
                        print(f.read())
                    found_log = True
                    break
            if not found_log:
                print("No smoke_test_error.txt found.")
            sys.exit(res.returncode)

    - name: Generate Documentation
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/generate_docs.py
        
    - name: Enforce Documentation Synchronization
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        if [[ -n $(git status -s docs/api_reference.md docs/admin_guide.md docs/ui.md SECURITY.md) ]]; then
          echo "Documentation is out of sync! Please run 'uv run python scripts/generate_docs.py' and commit the changes."
          exit 1
        fi
        
    - name: Validate Documentation Integrity
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run mkdocs build --strict
        
    - name: Deploy Documentation
      if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
      run: |
        uv run mkdocs gh-deploy --force
