name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        uv sync --all-groups
        
    - name: Lint with Ruff
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run ruff check .
        
    - name: Validate External Links
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/validate_links.py
        
    - name: Validate API and CLI Signatures
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/validate_signatures.py
        
    - name: Validate Architectural Guardrails
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/validate_architecture.py
        
    - name: Validate Agent Prompts Manifest
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/prompt_manifest.py verify
        
    - name: Validate Configuration Schema
      run: |
        uv run python scripts/validate_config.py
        
    - name: CLI Smoke Tests
      run: |
        uv run python scripts/test_cli.py
        
    - name: Test with pytest
      id: run-tests
      shell: bash
      env:
        SMOKE_TEST: "0"
      run: |
        uv run pytest --cov --cov-report=term tests/ > pytest_out.log 2>&1 || (cat pytest_out.log && exit 1)

    - name: Post failure to PR comment
      if: failure() && matrix.os == 'windows-latest'
      continue-on-error: true
      shell: bash
      run: |
        if [ -f pytest_out.log ]; then
          echo "### pytest Windows Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 150 pytest_out.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 150 pytest_out.log > pytest_traceback.log
          git config --global user.name "GHA Bot"
          git config --global user.email "gha@bot.local"
          git add pytest_traceback.log
          git commit -m "chore: upload pytest traceback on windows failure [skip ci]" || true
          git push origin HEAD:jules/a11y-modal-list-focus-js1-b9345ba9-256b-48d5-8a9b-4fca31773bf6 || true
        fi

    - name: Build executable (Lite)
      if: matrix.os == 'windows-latest'
      run: |
        uv run python scripts/build.py --lite

    - name: Verify compiled executable (Windows Smoke Test)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        dist/smart-autosorter/smart-autosorter.exe --smoke-test > smoke_test_out.log 2>&1 || (cat smoke_test_out.log && exit 1)

    - name: Post smoke test failure to PR comment
      if: failure() && matrix.os == 'windows-latest'
      continue-on-error: true
      shell: bash
      run: |
        if [ -f smoke_test_out.log ]; then
          tail -n 150 smoke_test_out.log > smoke_test_traceback.log
          git config --global user.name "GHA Bot"
          git config --global user.email "gha@bot.local"
          git add smoke_test_traceback.log
          git commit -m "chore: upload smoke test traceback on windows failure [skip ci]" || true
          git push || true
        fi

    - name: Generate Documentation
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/generate_docs.py
        
    - name: Enforce Documentation Synchronization
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        if [[ -n $(git status -s docs/api_reference.md docs/admin_guide.md docs/ui.md SECURITY.md) ]]; then
          echo "Documentation is out of sync! Please run 'uv run python scripts/generate_docs.py' and commit the changes."
          exit 1
        fi
        
    - name: Validate Documentation Integrity
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run mkdocs build --strict
        
    - name: Deploy Documentation
      if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
      run: |
        uv run mkdocs gh-deploy --force
