name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A new push to a PR supersedes the run in progress. On main, a run in
# progress always finishes, so main gets a result even when merges land
# faster than CI runs; only the newest waiting run is kept.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  security-and-audit:
    name: Security & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen --only-group dev --no-install-project

    - name: Run Dependency Audit
      run: |
        uv audit --ignore-until-fixed GHSA-w8v5-vhqr-4h9v

    - name: Secret Scanning Guardrails
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Workflow Linting
      uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  type-check:
    name: Type Check (ty)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen

    - name: Run ty Type Check
      run: |
        uv run ty check --output-format github

  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen --all-groups

    - name: Lint with Ruff
      run: |
        uv run ruff check .

    - name: Validate External Links
      run: |
        uv run python scripts/validate_links.py

    - name: Validate API and CLI Signatures
      run: |
        uv run python scripts/validate_signatures.py

    - name: Validate Architectural Guardrails
      run: |
        uv run python scripts/validate_architecture.py

    - name: Validate Import Gate
      run: |
        uv run python scripts/validate_imports.py

    - name: Check dependency declarations
      run: |
        uv run deptry .

    - name: Validate Agent Prompts Manifest
      run: |
        uv run python scripts/prompt_manifest.py verify

    - name: Validate Diagram Specifications and Toolchain
      run: |
        uv run python scripts/diagram_toolchain.py verify

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"

    # docs --check renders every diagram with mermaid-cli. Without it the
    # toolchain only checks syntax and a diagram Mermaid can't parse passes.
    - name: Install Mermaid renderer
      run: |
        npm install --global @mermaid-js/mermaid-cli@12.0.0
        # Ubuntu 24.04 runners block unprivileged user namespaces through
        # AppArmor, so headless Chrome dies with "No usable sandbox!". Allow
        # them rather than running Chrome with --no-sandbox.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        # Fail here, not silently in docs --check, if headless Chrome can't start.
        printf 'graph TD\n  A --> B\n' > "$RUNNER_TEMP/probe.mmd"
        mmdc -i "$RUNNER_TEMP/probe.mmd" -o "$RUNNER_TEMP/probe.svg"

    - name: Validate Documentation and Integrity
      run: |
        uv run python scripts/generate_docs.py --check

  build-and-test:
    name: Build & Test
    strategy:
      # Let every OS finish so a failure on one doesn't hide the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen --all-groups

    - name: Terminal Interface Snapshot Validation
      run: |
        uv run pytest tests/test_visual_snapshots.py -n 0

    - name: Upload Snapshot Mismatch Artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: snapshot-mismatches-${{ matrix.os }}
        path: |
          tests/snapshots/tui_svg/*.actual
          tests/snapshots/*.actual
        retention-days: 7

    - name: Validate Configuration Schema
      run: |
        uv run python scripts/validate_config.py

    - name: CLI Smoke Tests
      run: |
        uv run python scripts/test_cli.py

    - name: Fast Smoke Tests
      env:
        SMOKE_TEST: "0"
      shell: bash
      run: |
        # Fast-suite coverage was 76% on Linux when this gate was set (#738); the
        # margin leaves room for platform-specific skips on Windows and macOS.
        # Linux also measures branches (72.9% on 2026-10-19) for the per-module
        # floors checked in the next step.
        BRANCH_FLAG=""
        if [ "$RUNNER_OS" = "Linux" ]; then BRANCH_FLAG="--cov-branch"; fi
        if ! uv run pytest -m "not slow" -n auto --cov=app $BRANCH_FLAG --cov-report=xml --cov-report=html --cov-report=json --cov-report=term --cov-fail-under=70 tests/; then
          if [ -f pytest_failures.txt ]; then
            echo "=== PYTEST FAILURES ==="
            cat pytest_failures.txt
          else
            echo "No pytest_failures.txt found."
          fi
          exit 1
        fi

    - name: Check Data-Safety Coverage Floors
      if: matrix.os == 'ubuntu-latest'
      run: |
        uv run python scripts/check_coverage_floors.py coverage.json

    - name: Upload Test Coverage Artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-coverage-report
        path: |
          htmlcov/
          coverage.xml
        retention-days: 14

    - name: Build executable (Lite)
      run: |
        uv run python scripts/build.py --lite

    - name: Verify PE Binary Dependencies
      run: |
        uv run python scripts/verify_pe_dependencies.py --allow-empty

    - name: Verify compiled executable (Smoke Test)
      shell: python
      run: |
        import subprocess, sys, os
        exe_ext = ".exe" if sys.platform == "win32" else ""
        cli_exe = os.path.join("dist", "smart-autosorter", f"smart-autosorter{exe_ext}")
        if not os.path.exists(cli_exe):
            print(f"Missing CLI executable target: {cli_exe}")
            sys.exit(1)
        res = subprocess.run([cli_exe, "--smoke-test"])
        if res.returncode != 0:
            print(f"Smoke test failed with exit code {res.returncode}")
            found_log = False
            for path in ["smoke_test_error.txt", os.path.join("dist", "smart-autosorter", "smoke_test_error.txt")]:
                if os.path.exists(path):
                    with open(path, "r", encoding="utf-8") as f:
                        print("=== smoke_test_error.txt ===")
                        print(f.read())
                    found_log = True
                    break
            if not found_log:
                print("No smoke_test_error.txt found.")
            sys.exit(res.returncode)

  changes:
    name: Detect Documentation Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists the PR's files
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          docs:
            - 'docs/**'
            - 'mkdocs.yml'

  # The only job that keeps checkout credentials: mkdocs gh-deploy pushes.
  doc-deploy:
    name: Doc Deploy
    needs: [static-checks, changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # mkdocs gh-deploy pushes with the persisted token, and only on main.
        # PR runs never deploy, so they keep the token out of .git/config.
        persist-credentials: ${{ github.ref == 'refs/heads/main' }}

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen --group docs

    - name: Deploy Documentation
      if: github.ref == 'refs/heads/main'
      run: |
        uv run mkdocs gh-deploy --force

  heavy-tests:
    name: Heavy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Cache Model Weights and Assets
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.smart-autosorter/offline_bundle
          offline_bundle/
          ~/.cache/huggingface
        # No restore-keys: weights saved for another manifest must not be
        # restored and tested as if they were the pinned ones.
        key: model-weights-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'offline_bundle/**', 'scripts/prompt_manifest.py', '.github/AGENTS/manifest.json') }}

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --frozen --all-groups

    - name: Heavy ML and Integration Tests
      shell: bash
      run: |
        uv sync --frozen --all-groups --extra ml
        if ! uv run pytest -m "slow" -n auto --cov --cov-report=term tests/; then
          if [ -f pytest_failures.txt ]; then
            echo "=== PYTEST FAILURES ==="
            cat pytest_failures.txt
          else
            echo "No pytest_failures.txt found."
          fi
          exit 1
        fi

  verify-offline-bundle:
    name: Verify Offline Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Cache Offline Wheel Downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # setup-uv already caches uv's downloads, and prepare_offline.py
        # deletes offline_bundle/wheels on start, so only pip's cache helps.
        path: |
          ~/.cache/pip
        key: offline-wheels-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'offline_bundle/requirements.txt') }}
        restore-keys: |
          offline-wheels-${{ runner.os }}-

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.1"
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Prepare Offline Bundle
      run: |
        uv run python scripts/prepare_offline.py --cpu

    - name: Verify Offline Bundle Archive Exists
      run: |
        if [ ! -f offline_bundle.zip ]; then
          echo "Error: offline_bundle.zip was not produced by scripts/prepare_offline.py"
          exit 1
        fi

    - name: Install Offline Bundle
      run: |
        uv run python scripts/install_offline.py offline-install

    - name: Verify Application Import in Offline Environment
      run: |
        .venv/bin/python -c "import app, app.main, app.config, app.core; print('Application modules successfully imported from offline bundle environment!')"

  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security-and-audit, type-check, static-checks, build-and-test, heavy-tests, verify-offline-bundle]
    if: ${{ always() }}
    steps:
      - name: Verify Required Gates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const needsResults = ${{ toJson(needs) }};
            console.log("Job status results:", JSON.stringify(needsResults, null, 2));

            let failedJobs = [];
            for (const [jobName, jobData] of Object.entries(needsResults)) {
              if (!jobData || jobData.result !== 'success') {
                failedJobs.push(`${jobName}: ${jobData ? jobData.result : 'unknown/missing'}`);
              }
            }

            if (failedJobs.length > 0) {
              core.setFailed(`Required CI gate failed. The following required jobs did not succeed:\n${failedJobs.join('\n')}`);
            } else {
              console.log("All required CI checks passed successfully.");
            }
