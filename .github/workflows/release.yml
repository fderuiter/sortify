name: Release Binaries

# Publishing a GitHub release is the one trigger that ships binaries. A tag
# push used to trigger too, so a release created with a new tag built and
# uploaded everything twice, racing on the same asset names.
on:
  release:
    types: [published]
  # Dry-run the full build on PRs that change how releases are built, so a
  # broken release pipeline is caught before a release is published. The
  # publish job only runs for releases and is skipped for these runs.
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build.py'
      - 'smart-autosorter.spec'
      - 'scripts/verify_pe_dependencies.py'
  workflow_dispatch:

# Building runs third-party code (dependencies, PyInstaller, Syft) and also
# runs on PRs, so it gets a read-only token. Only the publish job, which runs
# for published releases, can write to the release and mint attestations.
permissions:
  contents: read

jobs:
  build-binaries:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: smart-autosorter-Windows.zip
          - os: ubuntu-latest
            artifact_name: smart-autosorter-Linux.tar.gz
          - os: macos-latest
            artifact_name: smart-autosorter-macOS.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The full build profile (scripts/build.py without --lite) refuses to
      # run unless the ML packages from the `ml` extra are installed.
      - name: Install dependencies
        run: |
          uv sync --frozen --extra ml --group build

      - name: Cache Model Weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            offline_bundle/
            ~/.EasyOCR/model/
            ~/.cache/huggingface
          # No restore-keys: weights saved for another manifest must not be
          # restored and shipped as if they were the pinned ones.
          key: model-weights-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'offline_bundle/**', 'scripts/prompt_manifest.py', '.github/AGENTS/manifest.json') }}

      - name: Build executable
        run: |
          uv run python scripts/build.py

      - name: Package as Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tar.exe -acf dist\${{ matrix.artifact_name }} -C dist smart-autosorter

      - name: Package as Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf dist/${{ matrix.artifact_name }} -C dist smart-autosorter

      - name: Generate Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path dist\${{ matrix.artifact_name }} -Algorithm SHA256
          $hash.Hash + "  ${{ matrix.artifact_name }}" | Out-File -FilePath dist\${{ matrix.artifact_name }}.sha256 -Encoding ascii

      - name: Generate Checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          cd ..

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/${{ matrix.artifact_name }}.sbom.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ runner.os }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
            dist/${{ matrix.artifact_name }}.sbom.json
            dist/smart-autosorter-models.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ matrix.os_name }}
    needs: build-binaries
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Windows
            artifact_name: smart-autosorter-Windows.zip
          - os_name: Linux
            artifact_name: smart-autosorter-Linux.tar.gz
          - os_name: macOS
            artifact_name: smart-autosorter-macOS.tar.gz

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.os_name }}
          path: dist

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/${{ matrix.artifact_name }}

      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: dist/${{ matrix.artifact_name }}
          sbom-path: dist/${{ matrix.artifact_name }}.sbom.json

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
            dist/${{ matrix.artifact_name }}.sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every OS packages the same model weights; upload them once so three
      # jobs don't race to replace the same asset.
      - name: Upload Model Weights
        if: matrix.os_name == 'Linux'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/smart-autosorter-models.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
