name: Release Binaries

# Publishing a GitHub release is the one trigger that ships binaries. A tag
# push used to trigger too, so a release created with a new tag built and
# uploaded everything twice, racing on the same asset names.
on:
  release:
    types: [published]
  # Dry-run the full build on PRs that change how releases are built, so a
  # broken release pipeline is caught before a release is published. The
  # publish job only runs for releases and is skipped for these runs.
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build.py'
      - 'smart-autosorter.spec'
  workflow_dispatch:

# Building runs third-party code (dependencies, PyInstaller, Syft) and also
# runs on PRs, so it gets a read-only token. Only the publish job, which runs
# for published releases, can write to the release and mint attestations.
permissions:
  contents: read

jobs:
  build-binaries:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: smart-autosorter-Windows.zip
          - os: ubuntu-latest
            artifact_name: smart-autosorter-Linux.tar.gz
          - os: macos-latest
            artifact_name: smart-autosorter-macOS.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The full build profile (scripts/build.py without --lite) refuses to
      # run unless the ML packages from the `ml` extra are installed.
      - name: Install dependencies
        run: |
          uv sync --frozen --extra ml --group build

      - name: Cache Model Weights
        uses: actions/cache@v6
        with:
          path: |
            offline_bundle/
            ~/.EasyOCR/model/
            ~/.cache/huggingface
          key: model-weights-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'offline_bundle/**', 'app/core/prompt_manifest.py') }}
          restore-keys: |
            model-weights-${{ runner.os }}-

      - name: Build executable
        run: |
          uv run python scripts/build.py

      - name: Package as Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tar.exe -acf dist\${{ matrix.artifact_name }} -C dist smart-autosorter

      - name: Package as Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf dist/${{ matrix.artifact_name }} -C dist smart-autosorter

      - name: Generate Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path dist\${{ matrix.artifact_name }} -Algorithm SHA256
          $hash.Hash + "  ${{ matrix.artifact_name }}" | Out-File -FilePath dist\${{ matrix.artifact_name }}.sha256 -Encoding ascii

      - name: Generate Checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          cd ..

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/${{ matrix.artifact_name }}.sbom.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
            dist/${{ matrix.artifact_name }}.sbom.json
            dist/smart-autosorter-models.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ matrix.os_name }}
    needs: build-binaries
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Windows
            artifact_name: smart-autosorter-Windows.zip
          - os_name: Linux
            artifact_name: smart-autosorter-Linux.tar.gz
          - os_name: macOS
            artifact_name: smart-autosorter-macOS.tar.gz

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.os_name }}
          path: dist

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.artifact_name }}

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/${{ matrix.artifact_name }}
          sbom-path: dist/${{ matrix.artifact_name }}.sbom.json

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
            dist/${{ matrix.artifact_name }}.sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every OS packages the same model weights; upload them once so three
      # jobs don't race to replace the same asset.
      - name: Upload Model Weights
        if: matrix.os_name == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/smart-autosorter-models.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
