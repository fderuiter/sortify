name: PR Risk Classifier

# pull_request_target runs this workflow file and the classifier from the base
# branch, so the PR being classified cannot change how it is classified. Never
# check out or execute the PR's head here: this job holds a write token.
on:
  pull_request_target:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

concurrency:
  group: pr-classify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify PR Risk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Extract PR Metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const unverifiedCommitShas = [];
            const commitMessages = [];
            for (const c of commits) {
              const verified = c.commit && c.commit.verification && c.commit.verification.verified;
              if (!verified) {
                unverifiedCommitShas.push(c.sha);
              }
              const parents = Array.isArray(c.parents) ? c.parents : [];
              const message = (c.commit && typeof c.commit.message === 'string') ? c.commit.message : '';
              if (message.trim() && parents.length <= 1) {
                commitMessages.push(message);
              }
            }
            const allCommitsVerified = commits.length > 0 && unverifiedCommitShas.length === 0;

            const filenames = files.map(f => f.filename);
            const additions = files.reduce((acc, f) => acc + f.additions, 0);
            const deletions = files.reduce((acc, f) => acc + f.deletions, 0);
            const author = (pr.user && pr.user.login) ? pr.user.login : '';
            const authorType = (pr.user && pr.user.type) ? pr.user.type : '';
            const botAuthors = new Set([
              'dependabot[bot]',
              'dependabot',
              'stitch',
              'jules',
              'github-actions[bot]',
            ]);
            const maintainerPermissions = new Set(['admin', 'maintain', 'write']);
            const liveLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            let labels = liveLabels.map(l => l.name);

            const isDependabot = author === 'dependabot[bot]';
            const headRef = pr.head ? pr.head.ref : '';
            const isApprovedBot = botAuthors.has(author) || author.endsWith('[bot]');
            const authorIsBot = authorType === 'Bot' || isApprovedBot;
            const headRepo = (pr.head && pr.head.repo) ? pr.head.repo : null;
            const baseRepo = (pr.base && pr.base.repo) ? pr.base.repo : null;
            const isBaseRepoBranch = Boolean(
              headRepo &&
              baseRepo &&
              typeof headRepo.full_name === 'string' &&
              typeof baseRepo.full_name === 'string' &&
              headRepo.full_name.trim() &&
              baseRepo.full_name.trim() &&
              headRepo.full_name.toLowerCase() === baseRepo.full_name.toLowerCase() &&
              (headRepo.id == null || baseRepo.id == null || headRepo.id === baseRepo.id)
            );
            const isFork = !isBaseRepoBranch;

            let authorPermission = 'none';
            if (author && !authorIsBot && !isFork) {
              try {
                const { data: authorPermData } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: author,
                });
                authorPermission = authorPermData.permission || 'none';
              } catch (err) {
                console.log('Could not verify PR author collaborator permission:', err.message);
                authorPermission = 'none';
              }
            }

            const isSecurityPatch = (
              (labels.includes('security') && labels.includes('dependencies')) ||
              headRef.startsWith('security/')
            ) && isApprovedBot;

            if (labels.includes('automerge')) {
              let appliedByMaintainer = false;
              try {
                const events = await github.paginate(github.rest.issues.listEvents, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100,
                });
                const labeledEvents = events.filter(
                  e => e.event === 'labeled' && e.label && e.label.name === 'automerge'
                );
                if (labeledEvents.length > 0) {
                  const actor = labeledEvents[labeledEvents.length - 1].actor || {};
                  const login = actor.login || '';
                  if (login && actor.type !== 'Bot' && !botAuthors.has(login) && !login.endsWith('[bot]')) {
                    const { data: permData } = await github.rest.repos.getCollaboratorPermissionLevel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      username: login,
                    });
                    appliedByMaintainer = maintainerPermissions.has(permData.permission || 'none');
                  }
                }
              } catch (err) {
                console.log('Could not verify maintainer permission for automerge label:', err.message);
                appliedByMaintainer = false;
              }
              if (!appliedByMaintainer) {
                labels = labels.filter(name => name !== 'automerge');
              }
            }

            async function fetchRawFile(filePath, ref) {
              if (!ref) return null;
              try {
                const resp = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath,
                  ref: ref,
                  mediaType: { format: 'raw' },
                });
                return typeof resp.data === 'string' ? resp.data : null;
              } catch (err) {
                if (err && err.status === 404) {
                  console.log(`File ${filePath} not found at ${ref} (404).`);
                  return null;
                }
                throw err;
              }
            }

            const manifestFields = {};
            const baseSha = (pr.base && pr.base.sha) ? pr.base.sha : '';
            const headSha = (pr.head && pr.head.sha) ? pr.head.sha : '';
            if ((isDependabot || isSecurityPatch) && baseSha && headSha) {
              if (filenames.includes('uv.lock')) {
                manifestFields.base_uv_lock = await fetchRawFile('uv.lock', baseSha);
                manifestFields.head_uv_lock = await fetchRawFile('uv.lock', headSha);
              }
              if (filenames.includes('offline_bundle/requirements.txt')) {
                manifestFields.base_requirements_txt = await fetchRawFile('offline_bundle/requirements.txt', baseSha);
                manifestFields.head_requirements_txt = await fetchRawFile('offline_bundle/requirements.txt', headSha);
              }
            }

            const meta = {
              pr_number: pr.number,
              title: pr.title,
              pr_body: typeof pr.body === 'string' ? pr.body : '',
              commit_messages: commitMessages,
              author: author,
              is_draft: pr.draft,
              labels: labels,
              changed_files: filenames,
              additions: additions,
              deletions: deletions,
              is_dependabot: isDependabot,
              is_security_patch: isSecurityPatch,
              all_commits_verified: allCommitsVerified,
              unverified_commit_shas: unverifiedCommitShas,
              author_permission: authorPermission,
              author_is_bot: authorIsBot,
              is_fork: isFork,
              ...manifestFields,
            };

            const fs = require('fs');
            fs.writeFileSync('pr_meta.json', JSON.stringify(meta, null, 2));

      - name: Run Classifier Script
        run: |
          python scripts/classify_pr.py --json-input pr_meta.json --output classification_result.json

      - name: Sync PR Labels & Post Status Check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('classification_result.json', 'utf8'));
            const prNumber = context.payload.pull_request.number;

            console.log("Classification result:", result);

            const currentLabelsData = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const currentLabelNames = currentLabelsData.map(l => l.name);

            const labelsToAdd = result.labels_to_add || [];
            const riskLevels = ['risk:low', 'risk:medium', 'risk:high', 'risk:sensitive', 'risk:baseline-change'];

            const riskLabelsToRemove = currentLabelNames.filter(name =>
              riskLevels.includes(name) && !labelsToAdd.includes(name)
            );

            const eligibilityLabelsToRemove = [];
            if (result.eligible && currentLabelNames.includes('automerge:blocked')) {
              eligibilityLabelsToRemove.push('automerge:blocked');
            }
            if (!result.eligible && currentLabelNames.includes('automerge:eligible')) {
              eligibilityLabelsToRemove.push('automerge:eligible');
            }

            const labelsToRemove = [...riskLabelsToRemove, ...eligibilityLabelsToRemove];

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label,
                });
              } catch (err) {
                if (err && err.status === 404) {
                  console.log(`Label ${label} already absent (404), continuing.`);
                  continue;
                }
                throw err;
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: labelsToAdd,
              });
            }

            const statusDescription = result.eligible
              ? 'Eligible for auto-merge'
              : `Human review required (${result.risk_level})`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              context: 'automerge/classification',
              description: statusDescription,
            });
