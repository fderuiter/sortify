name: Documentation Pages

# Publishes MkDocs documentation to GitHub Pages via OIDC deployment.
# Repository Settings > Pages > Build and deployment > Source must be set to
# "GitHub Actions" (rather than deploying from a branch).
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'app/**'
      - 'scripts/**'
      - 'sandbox_cli.py'
      - 'network_rules.json'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

# Keep in-progress runs intact while coalescing any queued runs per ref so an
# older run never overtakes and overwrites a newer main commit.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: building runs under read-only permissions; only deploy-docs
# requests Pages OIDC deployment permissions.
permissions:
  contents: read

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev --group docs

      - name: Build and Validate Documentation Site
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          uv run python scripts/generate_docs.py --check --local-only --build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy-docs:
    name: Deploy Documentation
    needs: [build-docs]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
