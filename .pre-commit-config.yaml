repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: ['--unsafe']  # mkdocs.yml uses a !!python/name tag
      - id: check-merge-conflict
      - id: debug-statements
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff Validation
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ty-check
        name: Ty Type Check
        entry: uv run ty check
        language: system
        pass_filenames: false
        files: '^(app/.*\.py|pyproject\.toml)$'
      - id: forbid-cache-files
        name: Block cache files, virtual environments, and bytecode
        entry: Cannot commit cache files, bytecode, or virtual environments. Please clean your workspace.
        language: fail
        files: '(\.pytest_cache/|\.venv/|\.coverage$|htmlcov/|__pycache__/|.*\.py[co]$)'
      - id: validate-docs
        name: Validate Documentation
        entry: uv run docs --check --no-build
        language: system
        pass_filenames: false
        files: '^(docs/|scripts/.*\.py|app/.*\.py|mkdocs\.yml|README\.md|PRIVACY\.md|SECURITY\.md)'
      - id: validate-diagram-artifacts
        name: Validate Diagram Artifacts and Mermaid Compilation
        entry: uv run python scripts/diagram_toolchain.py --verify
        language: system
        pass_filenames: false
        files: '^(app/ui/.*\.py|scripts/diagram_toolchain\.py|docs/assets/diagrams/.*|docs/.*\.md)$'
      - id: validate-links
        name: Validate External Links
        entry: uv run python scripts/validate_links.py --local-only
        language: system
        files: '\.(py|md)$'
      - id: validate-config-schema
        name: Validate Configuration Schema
        entry: uv run python scripts/validate_config.py
        language: system
        files: '^app/config\.py$'
      - id: validate-agent-prompts
        name: Validate Agent Prompts Manifest
        entry: uv run python scripts/prompt_manifest.py verify
        language: system
        pass_filenames: false
        files: '^\.github/AGENTS/.*$'
      - id: validate-signatures
        name: Validate API and CLI Signatures
        entry: uv run python scripts/validate_signatures.py
        language: system
        files: '(\.py$|tests/snapshots/.*)'
      - id: validate-architecture
        name: Validate Architectural Guardrails and System Utilities
        entry: uv run python scripts/validate_architecture.py
        language: system
        files: '^app/.*\.py$'
      - id: validate-imports
        name: Validate Import Gate and Direct Dependencies
        entry: uv run python scripts/validate_imports.py
        language: system
        files: '(^app/.*\.py$|^pyproject\.toml$|^uv\.lock$)'


