default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: end-of-file-fixer
        exclude: '^app/binaries/'
      - id: trailing-whitespace
        exclude: '^app/binaries/'
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]
        args: ["--force-exclude"]
      - id: ruff-check
        name: Ruff Validation
        entry: uv run ruff check
        language: system
        types: [python]
        args: ["--force-exclude"]
      - id: uv-lock-check
        name: Check uv lockfile consistency
        entry: uv lock --check
        language: system
        files: '^(pyproject\.toml|uv\.lock)$'
        pass_filenames: false
      - id: mypy
        name: Mypy Type Check
        entry: uv run mypy app
        language: system
        types: [python]
        pass_filenames: false
      - id: forbid-cache-files
        name: Block cache files, virtual environments, and bytecode
        entry: Cannot commit cache files, bytecode, or virtual environments. Please clean your workspace.
        language: fail
        files: '(\.pytest_cache/|\.venv/|\.coverage$|htmlcov/|__pycache__/|.*\.py[co]$)'
      - id: validate-docs
        name: Validate Documentation
        entry: uv run docs --check
        language: system
        pass_filenames: false
      - id: validate-links
        name: Validate External Links
        entry: uv run python scripts/validate_links.py
        language: system
        files: '\.(py|md)$'
        pass_filenames: false
      - id: validate-config-schema
        name: Validate Configuration Schema
        entry: uv run python scripts/validate_config.py
        language: system
        files: '^app/config\.py$'
        pass_filenames: false
      - id: validate-agent-prompts
        name: Validate Agent Prompts Manifest
        entry: uv run python scripts/prompt_manifest.py verify
        language: system
        files: '^\.github/AGENTS/.*$'
        pass_filenames: false
      - id: validate-duplicates
        name: Validate Duplicate System Utilities
        entry: uv run python scripts/validate_duplicates.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: validate-layout
        name: Validate UI Layout Classes
        entry: uv run python scripts/validate_layout.py
        language: system
        files: '\.py$'
        pass_filenames: false
      - id: validate-signatures
        name: Validate API and CLI Signatures
        entry: uv run python scripts/validate_signatures.py
        language: system
        files: '(\.py$|tests/snapshots/api_snapshot\.json$)'
        pass_filenames: false
      - id: validate-architecture
        name: Validate Architectural Guardrails
        entry: uv run python scripts/validate_architecture.py
        language: system
        files: '^app/.*\.py$'
        pass_filenames: false
