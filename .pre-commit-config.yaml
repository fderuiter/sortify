repos:
  - repo: local
    hooks:
      - id: check-added-large-files
        name: Check for added large files
        entry: uv run check-added-large-files
        language: system
        exclude: '^docs/assets/js/mermaid\.min\.js$'
      - id: check-case-conflict
        name: Check for case conflicts
        entry: uv run check-case-conflict
        language: system
      - id: check-json
        name: Check JSON
        entry: uv run check-json
        language: system
        types: [json]
      - id: check-toml
        name: Check TOML
        entry: uv run check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: Check YAML
        entry: uv run check-yaml
        language: system
        types: [yaml]
        exclude: '^mkdocs\.yml$'
      - id: check-merge-conflict
        name: Check for merge conflicts
        entry: uv run check-merge-conflict
        language: system
        types: [text]
      - id: debug-statements
        name: Debug Statements (Python)
        entry: uv run debug-statement-hook
        language: system
        types: [python]
      - id: no-commit-to-branch
        name: "Don't commit to branch"
        entry: uv run no-commit-to-branch
        args: ['--branch', 'main']
        language: system
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: Detect hardcoded secrets (staged)
        entry: uv run python scripts/run_secret_scan.py --mode staged
        args: ['--config', '.gitleaks.toml']
        language: system
        pass_filenames: false
      - id: gitleaks-dir
        name: Detect hardcoded secrets (working tree)
        entry: uv run python scripts/run_secret_scan.py --mode working-tree
        args: ['--config', '.gitleaks.toml']
        language: system
        pass_filenames: false
      - id: actionlint
        name: Lint GitHub Actions workflows
        entry: uv run python scripts/run_actionlint.py
        language: system
        files: '^\.github/(workflows/.*\.ya?ml|actionlint\.ya?ml)$'
      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff Validation
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-exception-ceilings
        name: Ruff Exception Ceilings
        entry: uv run python scripts/check_ruff_exception_ceilings.py
        language: system
        pass_filenames: false
        files: '^((app|scripts|\.agents)/.*\.py|pyproject\.toml|uv\.lock)$'
      - id: ty-check
        name: Ty Type Check
        entry: uv run python scripts/check_ty_warnings.py
        language: system
        pass_filenames: true
        require_serial: true
        files: '^(sandbox_cli\.py|(app|scripts|tests|\.agents)/.*\.py|tests/ty_baseline\.json|pyproject\.toml|uv\.lock)$'
      - id: forbid-cache-files
        name: Block cache files, virtual environments, and bytecode
        entry: Cannot commit cache files, bytecode, or virtual environments. Please clean your workspace.
        language: fail
        files: '(\.pytest_cache/|\.venv/|\.coverage(\..*)?$|htmlcov/|__pycache__/|.*\.py[co]$)'
      - id: validate-docs
        name: Validate Documentation
        entry: uv run python scripts/generate_docs.py --check --no-build --local-only
        language: system
        pass_filenames: false
        files: '^(docs/|scripts/.*\.py|app/.*\.py|app/config_schema\.json|network_rules\.json|pyproject\.toml|uv\.lock|mkdocs\.yml|README\.md|PRIVACY\.md|SECURITY\.md)'
      - id: validate-diagram-artifacts
        name: Validate Diagram Artifacts and Mermaid Compilation
        entry: uv run python scripts/diagram_toolchain.py --verify
        language: system
        pass_filenames: false
        files: '^(app/ui/.*\.py|scripts/diagram_schema\.py|scripts/diagram_toolchain\.py|docs/assets/diagrams/.*|docs/.*\.md)$'
      - id: validate-links
        name: Validate External Links
        entry: uv run python scripts/validate_links.py --local-only
        language: system
        files: '\.(py|md)$'
        exclude: '^tests/'
      - id: validate-config-schema
        name: Validate Configuration Schema
        entry: uv run python scripts/validate_config.py --check
        language: system
        pass_filenames: false
        files: '^(app/config\.py|app/config_schema\.json|pyproject\.toml|uv\.lock|scripts/validate_config\.py)$'
      - id: validate-agent-prompts
        name: Validate Agent Prompts Manifest
        entry: uv run python scripts/prompt_manifest.py verify --strict
        language: system
        pass_filenames: false
        files: '^(\.github/AGENTS/.*|scripts/prompt_manifest\.py)$'
      - id: validate-signatures
        name: Validate API and CLI Signatures
        entry: uv run python scripts/validate_signatures.py
        language: system
        pass_filenames: true
        files: '^(app/(cli|core|plugins)/.*\.py|app/(main|config)\.py|app/ui/protocols\.py|sandbox_cli\.py|tests/snapshots/.*|tests/test_visual_snapshots\.py|pyproject\.toml|uv\.lock)$'
      - id: validate-architecture
        name: Validate Architectural Guardrails and System Utilities
        entry: uv run python scripts/validate_architecture.py
        language: system
        pass_filenames: true
        files: '^(app/.*\.py|scripts/validate_architecture\.py|scripts/diagram_schema\.py|docs/assets/diagrams/.*|pyproject\.toml|uv\.lock)$'
      - id: deptry
        name: Check dependency declarations
        entry: uv run deptry .
        language: system
        pass_filenames: false
        files: '^((app|scripts)/.*\.py|sandbox_cli\.py|pyproject\.toml|uv\.lock)$'


