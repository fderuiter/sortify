[build-system]
requires = ["hatchling>=1.27.0, <2.0.0"]
build-backend = "hatchling.build"

[project]
name = "smart-autosorter"
version = "0.1.0"
description = "Local, offline-first document organizer that sorts folders by rules and content clustering"
readme = "README.md"
requires-python = ">=3.12,<4"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Frederick de Ruiter" }]
keywords = ["file-organizer", "document-clustering", "tui", "offline", "tf-idf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pandas",
    "scikit-learn",
    "python-docx",
    "pypdf",
    "pypdfium2",
    "openpyxl",
    "pydantic-settings",
    "watchdog>=6.0.0",
    "pylnk3>=0.4.2",
    "cryptography>=41.0.0",
    "keyring>=24.0.0",
    "jsonschema>=4.25.1",
    "sqlcipher3-wheels==0.5.7",
    "textual>=0.50.0",
    "rich",
    "pillow",
    "python-pptx",
    "xlrd",
    "scipy",
    "numpy",
    "pydantic",
    "psutil",
]

[project.urls]
Homepage = "https://github.com/fderuiter/sortify"
Issues = "https://github.com/fderuiter/sortify/issues"
Documentation = "https://github.com/fderuiter/sortify/tree/main/docs"

[project.optional-dependencies]
ml = [
    "easyocr>=1.7.0",
    "transformers>=4.57.6",
    "onnxruntime>=1.28.0",
    "llama-cpp-python>=0.3.34",
    "torch",
]

[project.scripts]
smart-autosorter = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# BLE001/S110/SIM105: no blind or silently swallowed exceptions (#783).
select = ["E", "F", "I", "D", "D417", "BLE001", "S110", "SIM105"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "F841", "E741", "BLE001", "S110", "SIM105"]
"scripts/*" = ["D", "BLE001", "S110", "SIM105"]
".agents/*" = ["BLE001", "S110", "SIM105"]
"app/core/metadata.py" = ["F841"]
"app/core/verifier.py" = ["F401", "E741"]

# Exception-handling baseline for #783: files that predate the rule. Fix a file
# and delete its line; never add one.
"app/cli/ledger_cli.py" = ["BLE001", "S110"]
"app/core/analyzer_strategies.py" = ["BLE001", "S110", "SIM105"]
"app/core/db.py" = ["BLE001", "S110", "SIM105"]
"app/core/db_conn.py" = ["BLE001", "S110", "SIM105"]
"app/core/db_worker.py" = ["BLE001", "S110", "SIM105"]
"app/core/history.py" = ["BLE001", "S110", "SIM105"]
"app/core/ledger.py" = ["BLE001", "S110", "SIM105"]
"app/core/mover.py" = ["BLE001", "S110", "SIM105"]
"app/core/resilient_file_ops.py" = ["BLE001", "S110", "SIM105"]
"app/core/session.py" = ["BLE001", "S110", "SIM105"]
"app/main.py" = ["BLE001", "S110", "SIM105"]
"app/ui/a11y.py" = ["BLE001", "S110", "SIM105"]
"app/ui/modals/*.py" = ["BLE001", "S110", "SIM105"]
"app/ui/mixins/*.py" = ["BLE001", "S110", "SIM105"]
"app/ui/tui.py" = ["BLE001", "S110", "SIM105"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
error-on-warning = false

[tool.ty.src]
include = ["app"]

[tool.ty.analysis]
# Optional `ml` extra packages, imported lazily behind guards.
allowed-unresolved-imports = [
    "easyocr",
    "llama_cpp",
    "onnxruntime",
    "torch",
    "transformers",
]

[tool.ty.rules]
# `def f(x: str = None)` is used throughout; mypy ran with implicit_optional.
invalid-parameter-default = "ignore"

# Modules mypy skipped with ignore_errors. Shrink this list as modules are typed.
[[tool.ty.overrides]]
include = [
    "app/ui/**",
    "app/cli/**",
    "app/core/db.py",
    "app/core/db_conn.py",
    "app/core/db_worker.py",
    "app/core/quarantine_interceptor.py",
    "app/core/semantic_embeddings.py",
    "app/core/session.py",
]

[tool.ty.overrides.rules]
all = "ignore"

# Modules mypy passed only because it skips the bodies of unannotated functions.
# ty checks them, so their findings are warnings until fixed.
[[tool.ty.overrides]]
include = [
    "app/core/history.py",
    "app/core/mover.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
invalid-method-override = "warn"
no-matching-overload = "warn"
unresolved-attribute = "warn"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "deptry>=0.25.0",
    "hypothesis>=6.170.2",
    "pefile>=2023.2.7",
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
    "reportlab>=5.0.0",
    "requests>=2.32.0",
    "ruff>=0.16.9",
    "ty>=0.0.89",
]

build = [
    "pyinstaller>=6.12.0",
    "pefile>=2023.2.7",
    "sqlcipher3-wheels==0.5.7",
]

[tool.deptry]
# The scripts in scripts/ are contributor tooling, so their imports may come from dev-only groups.
known_first_party = ["app", "scripts"]

[tool.deptry.package_module_name_map]
llama-cpp-python = "llama_cpp"
pyinstaller = "PyInstaller"

[tool.deptry.per_rule_ignores]
# Dev-only tools imported by scripts/ and by the repo-only docs generator.
DEP001 = ["PyInstaller", "requests"]
DEP004 = ["pefile", "PyInstaller", "requests", "yaml"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
timeout = 360
addopts = "-n auto --dist=loadgroup"
markers = [
    "slow: marks tests as slow / heavy ML, snapshot, or integration tests (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "ml: marks machine learning model tests",
    "real_db_worker: run against the real asynchronous DBWorker write queue instead of the synchronous test stand-in",
    "subprocess_clustering: run RecursiveKMeansStrategy in its spawned child process instead of inline",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/demo.py",
    "*__init__.py",
]

[tool.coverage.report]
show_missing = true

# Per-module floors for the code that moves, undoes and encrypts user files,
# checked on Linux by scripts/check_coverage_floors.py with branch coverage on.
# Set about two points under what main measured on 2026-10-19; raise a floor
# when tests raise its module, never lower it to get a PR green. Target: 90.
[tool.sortify.coverage-floors]
"app/core/mover.py" = 74
"app/core/history.py" = 66
"app/core/resilient_file_ops.py" = 71
"app/core/ledger.py" = 84
"app/core/crypto.py" = 86
"app/core/daemon.py" = 70
"app/core/db_conn.py" = 71
"app/core/verifier.py" = 82
"app/core/path_utils.py" = 77
