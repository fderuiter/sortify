[build-system]
requires = ["hatchling>=1.27.0, <2.0.0"]
build-backend = "hatchling.build"

[project]
name = "smart-autosorter"
version = "0.1.0"
description = "Local, offline-first document organizer that sorts folders by rules and content clustering"
readme = "README.md"
requires-python = ">=3.12,<4"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Frederick de Ruiter" }]
keywords = ["file-organizer", "document-clustering", "tui", "offline", "tf-idf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pandas",
    "scikit-learn",
    "python-docx",
    "pypdf",
    "pypdfium2",
    "openpyxl",
    "pydantic-settings",
    "watchdog>=6.0.0",
    "pylnk3>=0.4.2",
    "cryptography>=41.0.0",
    "keyring>=24.0.0",
    "jsonschema>=4.25.1",
    "sqlcipher3-wheels==0.5.7",
    "textual>=0.50.0",
    "rich",
    "pillow",
    "python-pptx",
    "xlrd",
    "scipy",
    "numpy",
    "pydantic",
    "psutil",
]

[project.urls]
Homepage = "https://github.com/fderuiter/sortify"
Issues = "https://github.com/fderuiter/sortify/issues"
Documentation = "https://github.com/fderuiter/sortify/tree/main/docs"

[project.optional-dependencies]
ml = [
    "easyocr>=1.7.0",
    "transformers>=4.57.6",
    "onnxruntime>=1.28.0",
    "llama-cpp-python>=0.3.34",
    "torch",
]

[project.scripts]
smart-autosorter = "app.main:main"
docs = "app.cli.generate_docs:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
exclude = [
    "app/binaries",
]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "D417"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "F841", "E741"]
"scripts/*" = ["D"]
"app/core/metadata.py" = ["F841"]
"app/core/verifier.py" = ["F401", "E741"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
error-on-warning = false

[tool.ty.src]
include = ["app"]
exclude = ["app/binaries"]

[tool.ty.analysis]
# Optional `ml` extra and `docs` group packages, imported lazily behind guards.
allowed-unresolved-imports = [
    "easyocr",
    "llama_cpp",
    "mkdocs",
    "onnxruntime",
    "torch",
    "transformers",
]

[tool.ty.rules]
# `def f(x: str = None)` is used throughout; mypy ran with implicit_optional.
invalid-parameter-default = "ignore"

# Modules mypy skipped with ignore_errors. Shrink this list as modules are typed.
[[tool.ty.overrides]]
include = [
    "app/ui/**",
    "app/cli/**",
    "app/main.py",
    "app/core/analyzer.py",
    "app/core/analyzer_strategies.py",
    "app/core/cache.py",
    "app/core/daemon.py",
    "app/core/db.py",
    "app/core/db_conn.py",
    "app/core/db_worker.py",
    "app/core/downloader.py",
    "app/core/env_helper.py",
    "app/core/extractor.py",
    "app/core/extractor_strategies.py",
    "app/core/file_renamer.py",
    "app/core/forensic_scanner.py",
    "app/core/hashes_registry.py",
    "app/core/integration.py",
    "app/core/jev_classifier.py",
    "app/core/ledger.py",
    "app/core/link_manager.py",
    "app/core/metadata.py",
    "app/core/offline_loader.py",
    "app/core/path_utils.py",
    "app/core/quarantine_interceptor.py",
    "app/core/scanner.py",
    "app/core/semantic_embeddings.py",
    "app/core/session.py",
    "app/core/shared_registry.py",
    "app/core/text_utils.py",
    "app/core/user_space_bootstrap.py",
]

[tool.ty.overrides.rules]
all = "ignore"

# Modules mypy passed only because it skips the bodies of unannotated functions.
# ty checks them, so their findings are warnings until fixed.
[[tool.ty.overrides]]
include = [
    "app/core/crypto.py",
    "app/core/diagram_schema.py",
    "app/core/history.py",
    "app/core/mover.py",
    "app/core/policy_engine.py",
    "app/core/resilient_file_ops.py",
    "app/demo.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "warn"
invalid-method-override = "warn"
no-matching-overload = "warn"
unresolved-attribute = "warn"

[dependency-groups]
dev = [
    "deptry",
    "pefile>=2023.2.7",
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "reportlab>=5.0.0",
    "requests",
    "ruff>=0.16.9",
    "ty>=0.0.89",
]

docs = [
    # MkDocs 2.0 drops the plugin system mkdocstrings and Material rely on.
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<10",
    "mkdocstrings[python]>=1.0.6",
]

notebooks = [
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "notebook>=7.6.3",
]

build = [
    "pyinstaller",
    "pefile>=2023.2.7",
    "sqlcipher3-wheels==0.5.7",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
timeout = 360
addopts = "-n auto --dist=loadgroup"
markers = [
    "slow: marks tests as slow / heavy ML, snapshot, or integration tests (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "ml: marks machine learning model tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/demo.py",
    "app/main.py",
    "*__init__.py",
]

[tool.coverage.report]
show_missing = true
