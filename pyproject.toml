[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-autosorter"
version = "0.1.0"
description = "AI File Organizer Pro"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "pandas",
    "scikit-learn",
    "python-docx",
    "pypdf",
    "openpyxl",
    "pydantic-settings",
    "watchdog>=6.0.0",
    "pylnk3>=0.4.2",
    "cryptography>=41.0.0",
    "keyring>=24.0.0",
    "jsonschema>=4.25.1",
    "sqlcipher3-wheels==0.5.7",
    "textual>=0.50.0",
]

[project.optional-dependencies]
ml = [
    "easyocr>=1.7.0",
    "transformers>=4.57.6",
    "onnxruntime>=1.28.0",
    "llama-cpp-python>=0.3.34",
]

[project.scripts]
smart-autosorter = "app.main:main"
docs = "scripts.generate_docs:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
exclude = [
    "app/binaries",
]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "D417"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "F841", "E741"]
"scripts/*" = ["D"]
"app/core/metadata.py" = ["F841"]
"app/core/verifier.py" = ["F401", "E741"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
ignore_missing_imports = true
implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "app.ui.*",
    "app.cli.*",
    "app.main",
    "app.core.analyzer",
    "app.core.analyzer_strategies",
    "app.core.cache",
    "app.core.clinical_compliance",
    "app.core.clinical_renamer",
    "app.core.clinical_strategy",
    "app.core.clinical_taxonomy",
    "app.core.cro_multi_study_pipeline",
    "app.core.daemon",
    "app.core.db",
    "app.core.db_conn",
    "app.core.db_worker",
    "app.core.downloader",
    "app.core.env_helper",
    "app.core.extractor",
    "app.core.extractor_strategies",
    "app.core.file_renamer",
    "app.core.forensic_scanner",
    "app.core.hashes_registry",
    "app.core.integration",
    "app.core.jev_classifier",
    "app.core.ledger",
    "app.core.link_manager",
    "app.core.metadata",
    "app.core.offline_loader",
    "app.core.path_utils",
    "app.core.quarantine_interceptor",
    "app.core.scanner",
    "app.core.semantic_embeddings",
    "app.core.session",
    "app.core.shared_registry",
    "app.core.study_disambiguator",
    "app.core.text_utils",
    "app.core.user_space_bootstrap",
]
ignore_errors = true

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mypy",
    "pre-commit",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "reportlab>=5.0.0",
    "ruff",
    "jupyter",
    "ipykernel",
    "notebook",
]

build = [
    "pyinstaller",
    "sqlcipher3-wheels==0.5.7",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
timeout = 360
addopts = "-n auto --dist=loadgroup"
markers = [
    "slow: marks tests as slow / heavy ML, snapshot, or integration tests (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "ml: marks machine learning model tests",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
