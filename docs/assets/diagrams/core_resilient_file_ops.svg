  <text x="20" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Resilient File Operations Subsystem Workflow</text>
  <text x="20" y="70" font-family="sans-serif" font-size="12" fill="#64748b">Mermaid Diagram Specification (Fallback View):</text>
  <foreignObject x="20" y="90" width="760" height="210">
    <pre xmlns="http://www.w3.org/1999/xhtml" style="font-family: monospace; font-size: 12px; color: #334155; background: #ffffff; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; overflow: auto; height: 180px;">flowchart TD
req("Atomic File Transaction Request")
lock["Acquire Cross-process File Lock"]
transfer[["Chunked Stream Transfer"]]
hash{Post-transfer SHA256 Check}
rollback["Automatic Rollback &amp; Cleanup"]
complete(["Transaction Committed"])
req --&gt; lock
lock --&gt;|Lock Granted| transfer
transfer --&gt; hash
hash --&gt;|Hash Match| complete
hash --&gt;|Hash Mismatch| rollback
rollback --&gt;|Retry| req
click req "docs/api_reference.md#appcoreresilient_file_ops" "Atomic Transaction Request"
click lock tooltip "Acquire Lock"</pre>
  </foreignObject>
